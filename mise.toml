[tools]
go = "1.25"
node = "20"

[tasks.bundle-api-spec]
description = "Bundle the v0 OpenAPI spec into api-spec/v0/dist/openapi.bundled.yaml"
run = "pnpm run bundle:api-spec"

[tasks.validate-api-spec]
description = "Validate the bundled OpenAPI YAML"
run = "pnpm run validate:api-spec"

[tasks.lint-api-spec]
description = "Lint the bundled OpenAPI YAML with Spectral"
run = "pnpm run lint:api-spec"

[tasks.lint-yaml-files]
description = "Lint hand-authored YAML files with yamllint"
run = "./scripts/lint-yaml-files"

[tasks.lint-go]
description = "Lint Go code with golangci-lint"
run = "golangci-lint run"

[tasks.lint-markdown-files]
description = "Lint Markdown files with markdownlint-cli2, excluding .github"
run = "pnpm run lint:markdown"

[tasks.check-format-contract-files]
description = "Check formatting for contract YAML and JSON files with Prettier"
run = "pnpm run check:fmt"

[tasks.check-json-schemas]
description = "Compile standalone JSON Schemas with Ajv"
run = "pnpm run check:schemas"

[tasks.check-spelling]
description = "Spell-check repository files with cspell"
run = "pnpm run check:spelling"

[tasks.scan-secrets]
description = "Scan the repository for secrets with gitleaks"
run = "gitleaks git --config .github/.gitleaks.toml ."

[tasks.check-openapi-breaking]
description = "Check the bundled OpenAPI artifact for breaking changes against a base ref"
run = "./scripts/check-openapi-breaking"

[tasks.check-api-spec]
description = "Bundle, validate, and lint the OpenAPI spec"
depends = ["bundle-api-spec", "validate-api-spec", "lint-api-spec"]

[tasks.build]
description = "Build the Go server"
run = "go build -o bin/apiserver ."

[tasks.run]
description = "Run the Go server locally"
depends = ["build"]
run = "bin/apiserver"

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.runlocaldeps]
description = "Start all local development dependencies"
run = "docker compose up -d"

[tasks.down]
description = "Stop all local development dependencies"
run = "docker compose down"

[tasks.check-contract-files]
description = "Run local lint, format, schema, and breaking-change checks for contract files"
depends = [
  "bundle-api-spec",
  "validate-api-spec",
  "lint-api-spec",
  "lint-yaml-files",
  "check-format-contract-files",
  "check-json-schemas",
  "check-openapi-breaking",
]

[tasks.lint]
description = "Run routine repository lint and scan tasks"
depends = [
  "lint-go",
  "lint-markdown-files",
  "check-spelling",
  "check-contract-files",
  "scan-secrets",
]

openapi: 3.1.0
info:
  title: Verification Service API
  version: 0.1.0
  contact:
    name: Eligibility Made Easy (Emmy)
    url: https://www.cms.gov/medicaid-chip/community-engagement-support/eligibility-made-easy
  summary: >
    Alpha API contract for Emmy verification workflows supporting community
    engagement reporting.
  description: >
    Public alpha API contract for the Eligibility Made Easy (Emmy) verification
    service. Emmy is a CMS-developed suite of open-source tools that supports
    community engagement reporting through data sharing and verification across
    multiple data sources. This API allows state-managed applications to submit
    standardized identity payloads and request verification results such as
    education enrollment and VA disability rating data. Client applications
    must authenticate with an OAuth 2.0 bearer token obtained through the
    client credentials flow. This API is not stable and should be treated as
    highly volatile for the next several months. Breaking changes are likely as
    the alpha release evolves.
servers:
  - url: https://api.dev.emmy.cms.gov
    description: Emmy development environment
  - url: http://localhost:8000
    description: Local development
security:
  - OAuth2ClientCredentials: []
tags:
  - name: Education Verification
    description: >
      Operations for retrieving education enrollment data used in community
      engagement reporting
  - name: Veteran Verification
    description: >
      Operations for retrieving VA disability rating data used in community
      engagement reporting
paths:
  /api/v0/education-enrollments:
    post:
      tags:
        - Education Verification
      summary: Get education enrollment status
      description: >
        Returns the subject's current education enrollment status for the person
        identified in the supplied identity object. The caller must also
        present a bearer token proving the client application is authorized to
        use this API.
      operationId: getEducationEnrollmentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetEducationEnrollmentRequest"
            examples:
              standard:
                $ref: "#/components/examples/GetEducationEnrollmentRequestExample"
      responses:
        "200":
          description: Education enrollment status retrieved successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationEnrollmentResponse"
              examples:
                enrolled:
                  $ref: "#/components/examples/EducationEnrollmentResponseExample"
  /api/v0/veteran-disability-ratings:
    post:
      tags:
        - Veteran Verification
      summary: Get veteran disability status
      description: >
        Returns the subject's veteran combined disability rating for the person
        identified in the supplied identity object. The caller must also
        present a bearer token proving the client application is authorized to
        use this API.
      operationId: getVeteranDisabilityStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetVeteranDisabilityStatusRequest"
            examples:
              standard:
                $ref: "#/components/examples/GetVeteranDisabilityStatusRequestExample"
      responses:
        "200":
          description: Veteran disability status retrieved successfully.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeteranDisabilityStatusResponse"
              examples:
                rated:
                  $ref: "#/components/examples/VeteranDisabilityStatusResponseExample"
components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 bearer token proving the client application is authorized to
        access the Verification Service API. Only the client credentials grant
        is supported.
      flows:
        clientCredentials:
          tokenUrl: https://api.dev.emmy.cms.gov/oauth2/token
          scopes: {}
  headers:
    X-Request-ID:
      description: >
        Unique identifier for the request, used for tracing and debugging.
        This ID is generated by the server and returned in the response.
      schema:
        type: string
        format: uuid
  schemas:
    GetEducationEnrollmentRequest:
      $ref: ../../schema/v0/identity.schema.json
    EducationEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - enrollmentStatus
        - rawData
        - dataSource
      properties:
        enrollmentStatus:
          $ref: ../../schema/v0/school_enrollment_status.schema.json
          description: Current enrollment status for the identified person.
        rawData:
          type: object
          description: Raw response data from the National Student Clearinghouse.
        dataSource:
          type: string
          description: The source of the enrollment data.
          example: National Student Clearinghouse
    GetVeteranDisabilityStatusRequest:
      $ref: ../../schema/v0/identity.schema.json
    VeteranDisabilityStatusResponse:
      type: object
      additionalProperties: false
      required:
        - combinedDisabilityRating
        - rawData
        - dataSource
      properties:
        combinedDisabilityRating:
          $ref: ../../schema/v0/combined_disability_rating.schema.json
          description: VA combined disability rating for the identified person.
        rawData:
          type: object
          description: Raw response data from Veteran's Affairs.
        dataSource:
          type: string
          description: The source of the disability rating data.
          example: Veteran's Affairs
  examples:
    GetEducationEnrollmentRequestExample:
      value:
        firstName: Lynette
        middleName: Marie
        lastName: Oyola
        dateOfBirth: "1988-10-24"
        ssn: "123-45-6789"
    EducationEnrollmentResponseExample:
      value:
        enrollmentStatus: ENROLLED
        rawData:
          clientData:
            zaccountID: ""
            caseReferenceId: ""
            contactEmail: ""
            organizationName: ""
          identityDetails: null
          status:
            code: "0"
            message: Successful
            severity: Info
          studentInfoProvided:
            dateOfBirth: "1988-10-24"
            firstName: Lynette
            lastName: Oyola
            middleName: ""
          transactionDetails:
            notifiedDate: "2026-04-06 15:04:06.122"

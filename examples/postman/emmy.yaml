info:
  name: Enrollment API Workflow
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json

variable:
  - key: api_base
    value: ""
  - key: auth_base
    value: ""
  - key: client_id
    value: ""
  - key: client_secret
    value: ""
  - key: access_token
    value: ""
  - key: token_expiry
    value: ""

item:

  - name: Obtain Token with Client Credentials
    request:
      method: POST
      header:
        - key: Content-Type
          value: application/x-www-form-urlencoded
      auth:
        type: basic
        basic:
          - key: username
            value: "{{client_id}}"
          - key: password
            value: "{{client_secret}}"
      body:
        mode: urlencoded
        urlencoded:
          - key: grant_type
            value: client_credentials
      url:
        raw: "{{auth_base}}"
        host:
          - "{{auth_base}}"

    event:
      - listen: test
        script:
          exec:
            - |
              if (pm.response.code === 200) {
                  const body = pm.response.json();

                  if (!body.access_token) {
                      throw new Error("Token response missing access_token");
                  }

                  pm.collectionVariables.set("access_token", body.access_token);

                  if (body.expires_in) {
                      pm.collectionVariables.set(
                          "token_expiry",
                          String(Date.now() + (body.expires_in * 1000))
                      );
                  }

                  if (body.refresh_token) {
                      pm.collectionVariables.set("refresh_token", body.refresh_token);
                  }

                  console.log("Token acquired successfully");
              } else {
                  throw new Error(
                      `Token request failed: ${pm.response.code} ${pm.response.text()}`
                  );
              }

  - name: Get Enrollment Data
    request:
      method: POST
      header:
        - key: Authorization
          value: "Bearer {{access_token}}"
        - key: Content-Type
          value: application/json
      url:
        raw: "{{api_base}}/api/v0/education-enrollments"
        host:
          - "{{api_base}}"
        path:
          - api
          - v0
          - education-enrollments
      body:
        mode: raw
        raw: |
          {
            "firstName": "Lynette",
            "lastName": "Oyola",
            "dateOfBirth": "1988-10-24"
          }

    event:
      - listen: prerequest
        script:
          exec:
            - |
              const token = pm.collectionVariables.get("access_token");

              if (!token) {
                  throw new Error("Missing access_token. Token request likely failed.");
              }

      - listen: test
        script:
          exec:
            - |
              pm.test("Status is 200", function () {
                  pm.response.to.have.status(200);
              });

              pm.test("Response is JSON", function () {
                  pm.expect(
                      pm.response.headers.get("Content-Type")
                  ).to.include("application/json");
              });

              pm.test("Response body is not empty", function () {
                  const body = pm.response.json();
                  pm.expect(body).to.exist;
              });

  - name: Get Veteran Disability Ratings
    request:
      method: POST
      header:
        - key: Authorization
          value: "Bearer {{access_token}}"
        - key: Content-Type
          value: application/json
      url:
        raw: "{{api_base}}/api/v0/veteran-disability-ratings"
        host:
          - "{{api_base}}"
        path:
          - api
          - v0
          - veteran-disability-ratings
      body:
        mode: raw
        raw: |
          {
            "firstName": "Alfredo",
            "lastName": "Armstrong",
            "dateOfBirth": "1993-06-08",
            "ssn": "796-01-2476"
          }

    event:
      - listen: prerequest
        script:
          exec:
            - |
              const token = pm.collectionVariables.get("access_token");

              if (!token) {
                  throw new Error("Missing access_token. Token request likely failed.");
              }

      - listen: test
        script:
          exec:
            - |
              pm.test("Status is 200", function () {
                  pm.response.to.have.status(200);
              });

              pm.test("Response is JSON", function () {
                  pm.expect(
                      pm.response.headers.get("Content-Type")
                  ).to.include("application/json");
              });

              pm.test("Response body is not empty", function () {
                  const body = pm.response.json();
                  pm.expect(body).to.exist;
              });

$kind: http-request
name: Obtain Token with Client Credentials
url: "{{auth_base}}"
method: POST
body:
  type: urlencoded
  content:
    - key: grant_type
      value: client_credentials
      disabled: false
    - key: scope
      value: emmy-api/emmy-api-access
      disabled: true
auth:
  type: basic
  credentials:
    username: "{{client_id}}"
    password: "{{client_secret}}"
scripts:
  - type: afterResponse
    code: >-
      // After-response script on the Auth request

      // Captures the access_token and expiry from the token response


      if (pm.response.code === 200) {
          const body = pm.response.json();

          // Set the access token in the environment
          pm.environment.set("access_token", body.access_token);

          // Calculate and store token expiry time (in milliseconds)
          if (body.expires_in) {
              pm.environment.set("token_expiry", Date.now() + (body.expires_in * 1000));
          }

          // Optional: store refresh token if your API returns one
          if (body.refresh_token) {
              pm.environment.set("refresh_token", body.refresh_token);
          }

          console.log("access_token environment variable set successfully.");
      } else {
          console.error("❌ Token request failed with status:", pm.response.code);
          console.error("Response body:", pm.response.text());
      }
    language: text/javascript

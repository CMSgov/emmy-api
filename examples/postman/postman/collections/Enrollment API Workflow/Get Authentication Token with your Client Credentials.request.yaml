$kind: http-request
url: "{{auth_base}}"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: client_credentials
auth:
  type: basic
  credentials:
    username: "{{client_id}}"
    password: "{{client_secret}}"
scripts:
  - type: afterResponse
    code: |
      if (pm.response.code === 200) {
          const body = pm.response.json();

          if (!body.access_token) {
              throw new Error("Token response missing access_token");
          }

          pm.collectionVariables.set("access_token", body.access_token);

          if (body.expires_in) {
              pm.collectionVariables.set(
                  "token_expiry",
                  String(Date.now() + (body.expires_in * 1000))
              );
          }

          if (body.refresh_token) {
              pm.collectionVariables.set("refresh_token", body.refresh_token);
          }

          console.log("Token acquired successfully");
      } else {
          throw new Error(
              `Token request failed: ${pm.response.code} ${pm.response.text()}`
          );
      }
    language: text/javascript

$kind: http-request
name: Send Enrollment Request Batch - small
url: "{{api_base}}{{api_version0}}/batch-education-enrollments"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "batchId": "{{batchId}}",
      "submittedBy": "your-specified-submitterid",
      "callbackUrl": "https://your-system.example.com/webhooks/enrollment",
      "students": [
        {
          "recordId": "your-recordid-001",
          "firstName": "Ashley",
          "lastName": "Borden",
          "dateOfBirth": "1980-12-22"
        },
        {
          "recordId": "your-recordid-002",
          "firstName": "Maria",
          "lastName": "Chen",
          "dateOfBirth": "1998-11-22",
          "ssn": "123-45-6789"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |
      const batchId = `small-batch-${pm.variables.replaceIn("{{$guid}}")}`;

      pm.collectionVariables.set("batchId", batchId);

      const token = pm.collectionVariables.get("access_token");

      if (!token) {
          throw new Error("Missing access_token. Token request likely failed.");
      }
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.expect(
              pm.response.headers.get("Content-Type")
          ).to.include("application/json");
      });

      pm.test("Response body is not empty", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
    language: text/javascript

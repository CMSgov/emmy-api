$kind: http-request
name: Get Enrollments - not found
url: "{{api_base}}{{api_version1}}/education-enrollments"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |
    {
        "termsAcceptedIndicator": true,
        "personGivenName": "John",
        "personSurName": "Doe",
        "personBirthDate": "1999-01-02"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |
      const token = pm.collectionVariables.get("access_token");

      if (!token) {
          throw new Error("Missing access_token. Token request likely failed.");
      }
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.expect(
              pm.response.headers.get("Content-Type")
          ).to.include("application/json");
      });

      pm.test("Response body is not empty", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
    language: text/javascript

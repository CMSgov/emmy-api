$kind: http-request
name: Get Veteran Disability Ratings with SSN
url: "{{api_base}}{{api_version1}}/veteran-disability-ratings"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "vadrRequest": {
        "personGivenName": "Alfredo",
        "personSurName": "Armstrong",
        "personBirthDate": "1993-06-08",
        "personSocialSecurityNumber": "796-01-2476"
      }
    }
scripts:
  - type: beforeRequest
    code: |
      const token = pm.collectionVariables.get("access_token");

      if (!token) {
          throw new Error("Missing access_token. Token request likely failed.");
      }
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.expect(
              pm.response.headers.get("Content-Type")
          ).to.include("application/json");
      });

      pm.test("Response body is not empty", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
    language: text/javascript

$kind: http-request
name: Get Veteran Disability Ratings with Total Disability
url: "{{api_base}}/veteran-disability-ratings"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |
    {
      "firstName": "Jesse",
      "lastName": "Gray",
      "dateOfBirth": "1954-12-15",
      "ssn": "796-37-8881"
    }
scripts:
  - type: beforeRequest
    code: |
      const token = pm.collectionVariables.get("access_token");

      if (!token) {
          throw new Error("Missing access_token. Token request likely failed.");
      }
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.expect(
              pm.response.headers.get("Content-Type")
          ).to.include("application/json");
      });

      pm.test("Response body is not empty", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
    language: text/javascript
order: 4485288997376110

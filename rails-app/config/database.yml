# PostgreSQL configuration
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  database: <%= ENV.fetch("DB_NAME") { "postgres" } %>
  username: <%= ENV.fetch("DB_USER") { "emmy" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "emmy" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "postgres" } %>_test

production:
  <<: *default

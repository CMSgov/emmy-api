name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "rails-app/**"
      - "public.jwk"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Environment to deploy after publishing the image
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - sandbox
          - demo
          - uat
          - prod

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  API_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'emmy-api' }}
  IMAGE_REPOSITORY: ${{ vars.EMMY_IMAGE_REPO }}
  PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}

jobs:
  publish:
    name: push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.image-metadata.outputs.image_tag }}
      image_uri: ${{ steps.image-metadata.outputs.image_uri }}
      latest_image_uri: ${{ steps.image-metadata.outputs.latest_image_uri }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Validate workflow configuration
        shell: bash
        run: |
          if [[ -z "${IMAGE_REPOSITORY:-}" ]]; then
            echo "error: required Actions variable EMMY_IMAGE_REPO is not set" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, vars.AWS_ROLE_NAME) }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: cms-builder-${{ github.run_id }}
          driver: docker-container

      - name: Derive image metadata
        id: image-metadata
        shell: bash
        run: |
          {
            echo "image_tag=${GITHUB_SHA::7}"
            echo "image_uri=${IMAGE_REPOSITORY}:${GITHUB_SHA::7}"
            echo "latest_image_uri=${IMAGE_REPOSITORY}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE_URI: ${{ steps.image-metadata.outputs.image_uri }}
          LATEST_IMAGE_URI: ${{ steps.image-metadata.outputs.latest_image_uri }}
        run: |
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            -t "$IMAGE_URI" \
            -t "$LATEST_IMAGE_URI" \
            --platform "$PLATFORMS" \
            --push rails-app

  deploy:
    name: deploy ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'dev' }}
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'dev' }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, vars.AWS_ROLE_NAME) }}

      - name: Fetch and sanitize API task definition
        env:
          TASK_FAMILY: emmy-${{ env.DEPLOY_ENV }}-api
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > api-task-definition.json
          jq --arg container "$API_CONTAINER_NAME" \
            '(.containerDefinitions[] | select(.name == $container)) |= del(.repositoryCredentials)' \
            api-task-definition.json > api-task-definition.sanitized.json

      - name: Render updated API task definition
        id: render-api-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-definition.sanitized.json
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ needs.publish.outputs.image_uri }}

      - name: Deploy API task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api-task-definition.outputs.task-definition }}
          cluster: emmy-${{ env.DEPLOY_ENV }}
          service: emmy-${{ env.DEPLOY_ENV }}-api
          force-new-deployment: true
          wait-for-service-stability: true

      - name: Fetch and sanitize Shoryuken task definition
        env:
          TASK_FAMILY: emmy-${{ env.DEPLOY_ENV }}-shoryuken
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > shoryuken-task-definition.json
          jq '(.containerDefinitions[] | select(.name == "shoryuken")) |= del(.repositoryCredentials)' \
            shoryuken-task-definition.json > shoryuken-task-definition.sanitized.json

      - name: Render updated Shoryuken task definition
        id: render-shoryuken-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: shoryuken-task-definition.sanitized.json
          container-name: shoryuken
          image: ${{ needs.publish.outputs.image_uri }}

      - name: Deploy Shoryuken task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-shoryuken-task-definition.outputs.task-definition }}
          cluster: emmy-${{ env.DEPLOY_ENV }}
          service: emmy-${{ env.DEPLOY_ENV }}-shoryuken
          force-new-deployment: true
          wait-for-service-stability: true

name: markdownlint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"

jobs:
  markdownlint:
    permissions:
      contents: read
    runs-on: "emmy-github-runner-emmy-api-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: |
            **/*.md
            !.github/**/*.md

name: PR Verification
permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rails-app/**"
      - ".github/workflows/pr.yml"

jobs:
  rspec:
    name: rspec
    runs-on: "codebuild-emmy-github-runner-emmy-api-${{ github.run_id }}-${{ github.run_attempt }}"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emmy
          POSTGRES_PASSWORD: emmy
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Build Test Image
        run: |
          docker build \
            --build-arg RAILS_ENV=test \
            --build-arg BUNDLE_WITHOUT="" \
            -t emmy-rails-test \
            rails-app

      - name: Wait for Database
        run: |
          until printf "" 2>>/dev/tcp/postgres/5432; do
            echo "Waiting for postgres..."
            sleep 1
          done
        continue-on-error: true

      - name: Run RSpec
        run: |
          docker run --rm \
            --network host \
            -e RAILS_ENV=test \
            -e DB_HOST=localhost \
            -e DB_USER=emmy \
            -e DB_PASSWORD=emmy \
            -e REDIS_ADDR=localhost:6379 \
            emmy-rails-test \
            bin/bundle exec rspec

  rubocop:
    name: rubocop
    runs-on: "codebuild-emmy-github-runner-emmy-api-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Build Test Image
        run: |
          docker build \
            --build-arg RAILS_ENV=test \
            --build-arg BUNDLE_WITHOUT="" \
            -t emmy-rails-test \
            rails-app

      - name: RuboCop
        run: |
          docker run --rm \
            emmy-rails-test \
            bin/bundle exec rubocop

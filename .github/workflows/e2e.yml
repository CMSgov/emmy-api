name: End-to-End Test Verification

on:
  workflow_dispatch:
    inputs:
      emmy_env:
        description: 'Emmy Environment (dev, uat, demo)'
        required: true
        type: choice
        options:
          - dev
          - uat
          - demo
        default: 'uat'
      emmy_api_url:
        description: 'Override Emmy API URL (e.g., https://api.uat.emmy.cms.gov/api/v0)'
        required: false
      emmy_api_cognito_url:
        description: 'Override Emmy API Cognito Token URL'
        required: false

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: "codebuild-emmy-github-runner-emmy-api-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install -g newman js-yaml

      - name: Run E2E Tests
        env:
          CLIENT_ID: >-
            ${{ github.event.inputs.emmy_env == 'dev' && secrets.CLIENT_ID_DEV ||
                github.event.inputs.emmy_env == 'uat' && secrets.CLIENT_ID_UAT ||
                github.event.inputs.emmy_env == 'demo' && secrets.CLIENT_ID_DEMO }}
          CLIENT_SECRET: >-
            ${{ github.event.inputs.emmy_env == 'dev' && secrets.CLIENT_SECRET_DEV ||
                github.event.inputs.emmy_env == 'uat' && secrets.CLIENT_SECRET_UAT ||
                github.event.inputs.emmy_env == 'demo' && secrets.CLIENT_SECRET_DEMO }}
          API_BASE: ${{ github.event.inputs.emmy_api_url || (github.event.inputs.emmy_env == 'dev' && 'https://api.dev.emmy.cms.gov' || github.event.inputs.emmy_env == 'uat' && 'https://api.uat.emmy.cms.gov' || 'https://api.demo.emmy.cms.gov') }}
          AUTH_BASE: ${{ github.event.inputs.emmy_api_cognito_url || (github.event.inputs.emmy_env == 'dev' && 'https://emmy-dev.auth.us-east-1.amazoncognito.com/oauth2/token' || github.event.inputs.emmy_env == 'uat' && 'https://emmy-uat.auth.us-east-1.amazoncognito.com/oauth2/token' || 'https://emmy-demo.auth.us-east-1.amazoncognito.com/oauth2/token') }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "Error: CLIENT_ID or CLIENT_SECRET secrets not set in repository."
            exit 1
          fi
          chmod +x scripts/postman_e2e.sh
          ./scripts/postman_e2e.sh
